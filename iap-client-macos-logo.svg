<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="sq">
      <path d="M256 12C400 12,500 12,500 140L500 372C500 500,400 500,256 500C112 500,12 500,12 372L12 140C12 12,112 12,256 12Z"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#1a2654"/>
      <stop offset="50%" stop-color="#101c3e"/>
      <stop offset="100%" stop-color="#0a1228"/>
    </linearGradient>

    <linearGradient id="shield-fill" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#6aabff"/>
      <stop offset="30%" stop-color="#4285F4"/>
      <stop offset="70%" stop-color="#3367D6"/>
      <stop offset="100%" stop-color="#1a4fba"/>
    </linearGradient>

    <linearGradient id="shield-face" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#1e3d7a"/>
      <stop offset="100%" stop-color="#0f2555"/>
    </linearGradient>

    <radialGradient id="glow1" cx="0.5" cy="0.38" r="0.4">
      <stop offset="0%" stop-color="#4285F4" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#4285F4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow-warm" cx="0.35" cy="0.72" r="0.45">
      <stop offset="0%" stop-color="#FBBC04" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="keyhole-emit" cx="0.5" cy="0.35" r="0.5">
      <stop offset="0%" stop-color="#FBBC04" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#f0a500" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FBBC04" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow-lg" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow-sm" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <filter id="blur-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6"/>
    </filter>
    <filter id="text-soft">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0V32H0" fill="none" stroke="#fff" stroke-width="0.4" opacity="0.035"/>
    </pattern>

    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="0.6" fill="#fff" opacity="0.04"/>
    </pattern>
  </defs>

  <g clip-path="url(#sq)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#grid)"/>
    <rect width="512" height="512" fill="url(#dots)"/>
    <rect width="512" height="512" fill="url(#glow1)"/>
    <rect width="512" height="512" fill="url(#glow-warm)"/>

    <!-- GCP 4-color bar at very top -->
    <rect x="96"  y="42" width="80" height="3" rx="1.5" fill="#EA4335" opacity="0.9"/>
    <rect x="176" y="42" width="80" height="3" rx="1.5" fill="#FBBC04" opacity="0.9"/>
    <rect x="256" y="42" width="80" height="3" rx="1.5" fill="#34A853" opacity="0.9"/>
    <rect x="336" y="42" width="80" height="3" rx="1.5" fill="#4285F4" opacity="0.9"/>

    <!-- Faint concentric arcs behind shield for depth -->
    <circle cx="256" cy="235" r="160" fill="none" stroke="#4285F4" stroke-width="0.5" opacity="0.06"/>
    <circle cx="256" cy="235" r="130" fill="none" stroke="#4285F4" stroke-width="0.5" opacity="0.08"/>
    <circle cx="256" cy="235" r="100" fill="none" stroke="#4285F4" stroke-width="0.4" opacity="0.05"/>

    <!-- Ambient glow blob behind shield -->
    <ellipse cx="256" cy="230" rx="120" ry="130" fill="#4285F4" opacity="0.04" filter="url(#blur-glow)"/>

    <!-- ===== SHIELD ===== -->
    <g filter="url(#shadow-lg)" transform="translate(256, 230)">

      <!-- Outer shield shape -->
      <path d="
        M 0 -115
        L 96 -76
        Q 104 -72, 104 -62
        L 104 18
        Q 104 76, 52 110
        L 7 139
        Q 0 143, -7 139
        L -52 110
        Q -104 76, -104 18
        L -104 -62
        Q -104 -72, -96 -76
        Z
      " fill="url(#shield-fill)"/>

      <!-- Inner shield face -->
      <path d="
        M 0 -98
        L 82 -64
        Q 88 -61, 88 -53
        L 88 14
        Q 88 64, 44 94
        L 6 119
        Q 0 122, -6 119
        L -44 94
        Q -88 64, -88 14
        L -88 -53
        Q -88 -61, -82 -64
        Z
      " fill="url(#shield-face)"/>

      <!-- Faint inner border -->
      <path d="
        M 0 -98
        L 82 -64
        Q 88 -61, 88 -53
        L 88 14
        Q 88 64, 44 94
        L 6 119
        Q 0 122, -6 119
        L -44 94
        Q -88 64, -88 14
        L -88 -53
        Q -88 -61, -82 -64
        Z
      " fill="none" stroke="#4285F4" stroke-width="1" opacity="0.25"/>

      <!-- Outer shield highlight -->
      <path d="
        M 0 -115
        L 96 -76
        Q 104 -72, 104 -62
        L 104 18
        Q 104 76, 52 110
        L 7 139
        Q 0 143, -7 139
        L -52 110
        Q -104 76, -104 18
        L -104 -62
        Q -104 -72, -96 -76
        Z
      " fill="none" stroke="#fff" stroke-width="1" opacity="0.1"/>

      <!-- ===== LOCK ICON ===== -->
      <g filter="url(#shadow-sm)">
        <!-- Lock shackle -->
        <path d="
          M -17 -10
          L -17 -30
          Q -17 -50, 0 -50
          Q 17 -50, 17 -30
          L 17 -10
        " fill="none" stroke="#c8deff" stroke-width="8" stroke-linecap="round"/>

        <!-- Lock body -->
        <rect x="-26" y="-12" width="52" height="42" rx="7" fill="#e0ecff"/>

        <!-- Keyhole glow behind -->
        <circle cx="0" cy="8" r="18" fill="url(#keyhole-emit)" filter="url(#blur-glow)"/>

        <!-- Keyhole circle -->
        <circle cx="0" cy="5" r="8" fill="#1a4fba"/>

        <!-- Keyhole slot -->
        <path d="M-3.5 8 L0 24 L3.5 8Z" fill="#1a4fba"/>
      </g>

      <!-- GCP-colored dots on shield corners -->
      <circle cx="-70" cy="-50" r="4" fill="#EA4335" opacity="0.7"/>
      <circle cx="70"  cy="-50" r="4" fill="#34A853" opacity="0.7"/>
      <circle cx="-55" cy="75"  r="4" fill="#FBBC04" opacity="0.7"/>
      <circle cx="55"  cy="75"  r="4" fill="#4285F4" opacity="0.7"/>
    </g>

    <!-- ===== TEXT BLOCK ===== -->

    <!-- "IAP CLIENT" main title -->
    <text x="256" y="405" text-anchor="middle"
          font-family="'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif"
          font-size="32" font-weight="700" letter-spacing="6"
          fill="#ffffff" opacity="0.92">
      IAP CLIENT
    </text>

    <!-- macOS subtitle with Apple-style appearance -->
    <g transform="translate(256, 438)">
      <!-- Thin divider line -->
      <line x1="-70" y1="-10" x2="70" y2="-10" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

      <!-- "macOS" text -->
      <text x="0" y="6" text-anchor="middle"
            font-family="'SF Pro Text','Helvetica Neue',Helvetica,Arial,sans-serif"
            font-size="16" font-weight="500" letter-spacing="2.5"
            fill="#ffffff" opacity="0.5">
        macOS
      </text>
    </g>

    <!-- Bottom GCP color bar (mirroring top) -->
    <rect x="176" y="484" width="40" height="2" rx="1" fill="#EA4335" opacity="0.5"/>
    <rect x="216" y="484" width="40" height="2" rx="1" fill="#FBBC04" opacity="0.5"/>
    <rect x="256" y="484" width="40" height="2" rx="1" fill="#34A853" opacity="0.5"/>
    <rect x="296" y="484" width="40" height="2" rx="1" fill="#4285F4" opacity="0.5"/>
  </g>
</svg>
